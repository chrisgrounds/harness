[package]
name = "rs-gui-client"
version = "0.1.0"
edition = "2024"
description = "A native egui client for Harness"
license = "BSD-3-Clause"

[dependencies]
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
